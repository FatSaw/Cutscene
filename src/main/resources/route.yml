# '#X#Y#Z#YAW#PITCH#' Teleport to location.
# '(REPEAT)$#X#Y#Z#YAW#PITCH#' Do same thing multiple times
# '#~X#~Y#~Z#~YAW#~PITCH#' Relative movement. Can be turned on by adding ~ for X,Y,Z,YAW,PITCH
# '~#(FORWARD/-BACK)#(UP/-DOWN)#(LEFT/-RIGHT)#YAW#PITCH#' Turns off reference to world coordinates. Automaticaly turns on relative movement for X,Y,Z.
# '~#(FORWARD/-BACK)#(UP/-DOWN)#(LEFT/-RIGHT)#YAW#PITCH#DYAW#DPITCH#' The movement depends on direction DYAW and DPITCH
defaultroute:
  locations:
  - '180$~#0#0#-0.4#~2#~0#'
  - '180$~#0#0#0.4#~-2#~0#'
  - '180$~#0#-0.4#0#~0#~2#'
  - '180$~#0#+0.4#0#~0#~-2#'